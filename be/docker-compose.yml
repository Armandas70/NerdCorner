services:
  postgres:
    image: postgres:17-alpine
    container_name: nerdDB
    restart: on-failure
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    ports:
      - "5432:5432"
    volumes:
      - nerd_pg_data:/var/lib/postgresql/data

volumes:
  nerd_pg_data: